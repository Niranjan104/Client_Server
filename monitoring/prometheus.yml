global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "nginx_exporter"
    static_configs:
      - targets: ["nginx_exporter:9113"]

  - job_name: "tea_server"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "server_blue:8080"
          - "server_green:8080"
    relabel_configs:
      - source_labels: [__address__]
        regex: "server_(blue|green):.*"
        target_label: slot
        replacement: "$1"
